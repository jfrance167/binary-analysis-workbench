name: Windows checks and Bandit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; publisher package 7.0.1.0.0, current v7.0.1 tag verified 2026-10-07.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes --no-deps -r requirements-test.lock -r requirements-test-local.lock
      - name: Focused harmless tests
        run: python -m pytest -q --basetemp "${{ runner.temp }}/binary-workbench-tests"
      - name: Python security review
        shell: pwsh
        run: |
          python -m pip install bandit==1.9.4
          python -m bandit -r src -f json
