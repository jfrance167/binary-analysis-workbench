name: Windows checks and Bandit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; publisher package 5.0.0, current v5 tag verified 2026-10-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes --no-deps -r requirements-test.lock -r requirements-test-local.lock
      - name: Focused harmless tests
        run: python -m pytest -q --basetemp "${{ runner.temp }}/binary-workbench-tests"
      - name: Python security review
        shell: pwsh
        run: |
          python -m pip install bandit==1.9.4
          python -m bandit -r src -f json
